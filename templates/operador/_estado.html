<span class="rounded-full px-3 py-1 text-sm font-semibold
  {% if ticket.estado == 'reportado' %}bg-blue-100 text-blue-800
  {% elif ticket.estado == 'asignado' %}bg-indigo-100 text-indigo-800
  {% elif ticket.estado == 'en_proceso' %}bg-amber-100 text-amber-800
  {% elif ticket.estado == 'en_pausa' %}bg-orange-100 text-orange-800
  {% elif ticket.estado == 'resuelto' %}bg-teal-100 text-teal-800
  {% elif ticket.estado == 'cerrado' %}bg-green-100 text-green-800
  {% else %}bg-slate-200 text-slate-700{% endif %}">{{ ticket.get_estado_display }}</span>
