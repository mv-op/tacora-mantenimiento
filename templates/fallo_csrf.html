{% extends "base.html" %}
{% block titulo %}Página desactualizada · Mantenimiento{% endblock %}

{% block contenido %}
  <div class="mx-auto mt-6 max-w-md rounded-2xl bg-white p-6 text-center shadow">
    <div class="text-2xl font-bold">Página desactualizada</div>
    <p class="mt-3 text-slate-700">{{ mensaje }}</p>
    <div class="mt-6 grid gap-3">
      <button type="button" onclick="history.back()" class="rounded-xl bg-blue-600 px-6 py-4 text-lg font-semibold text-white">Volver y recargar</button>
      <a href="{% url 'inicio' %}" class="rounded-xl bg-slate-200 px-6 py-4 text-lg font-semibold">Ir al inicio</a>
    </div>
  </div>
{% endblock %}
