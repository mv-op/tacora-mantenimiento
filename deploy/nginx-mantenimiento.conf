# Bloque de Nginx para el CMMS. Empieza solo en HTTP:
# certbot (sudo certbot --nginx -d tecnosur.mantenimiento.tacorapp.com) agrega el HTTPS y la redirección.
server {
    listen 80;
    server_name tecnosur.mantenimiento.tacorapp.com;

    client_max_body_size 25M;

    location /static/ {
        alias /home/imrodriguez/tacora-mantenimiento/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/run/mantenimiento/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
